<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>회의·제안 일정</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#1a1d23; --sub:#697586; --line:#e3e6eb;
    --meet:#2563eb; --meet-bg:#e7efff; --prop:#ea580c; --prop-bg:#fdece0;
    --quote:#0d9488; --quote-bg:#d5f0eb;
    --today:#111827; --wknd:#b0b7c3; --shadow:0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1216; --card:#171b21; --ink:#e8eaed; --sub:#98a2b3; --line:#262b33;
      --meet:#5b8cff; --meet-bg:#182238; --prop:#ff8a4c; --prop-bg:#331e12;
      --quote:#2dd4bf; --quote-bg:#0f2e2a;
      --today:#e8eaed; --wknd:#5b636f; --shadow:0 1px 3px rgba(0,0,0,.4); }
  }
:root[data-theme="dark"]{ --bg:#0f1216; --card:#171b21; --ink:#e8eaed; --sub:#98a2b3; --line:#262b33; --meet:#5b8cff; --meet-bg:#182238; --prop:#ff8a4c; --prop-bg:#331e12; --quote:#2dd4bf; --quote-bg:#0f2e2a; --today:#e8eaed; --wknd:#5b636f; --shadow:0 1px 3px rgba(0,0,0,.4); }
  :root[data-theme="light"]{ --bg:#f4f5f7; --card:#ffffff; --ink:#1a1d23; --sub:#697586; --line:#e3e6eb; --meet:#2563eb; --meet-bg:#e7efff; --prop:#ea580c; --prop-bg:#fdece0; --quote:#0d9488; --quote-bg:#d5f0eb; --today:#111827; --wknd:#b0b7c3; --shadow:0 1px 3px rgba(16,24,40,.08); }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.45;
    padding:0 12px calc(40px + env(safe-area-inset-bottom));}
  .wrap{max-width:640px; margin:0 auto}
  header{position:sticky; top:0; z-index:5; background:var(--bg);
    padding:14px 2px 8px; display:flex; align-items:center; justify-content:space-between}
  h1{font-size:18px; margin:0; font-weight:800; letter-spacing:-.02em}
  .built{font-size:11px; color:var(--sub); font-weight:500}
  /* month nav */
  .mnav{display:flex; align-items:center; justify-content:center; gap:14px; margin:4px 0 10px}
  .mnav button{border:1px solid var(--line); background:var(--card); color:var(--ink);
    width:38px; height:38px; border-radius:12px; font-size:19px; cursor:pointer; box-shadow:var(--shadow)}
  .mnav .lbl{font-size:18px; font-weight:800; min-width:120px; text-align:center; letter-spacing:-.02em}
  /* segmented */
  .seg{display:flex; gap:6px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:4px; margin:0 0 12px; box-shadow:var(--shadow)}
  .seg button{flex:1; border:0; background:transparent; color:var(--sub); font-weight:700;
    padding:8px 0; border-radius:9px; font-size:14px; cursor:pointer}
  .seg button.on{color:#fff}
  .seg button.on[data-k="all"]{background:var(--today)}
  .seg button.on[data-k="meeting"]{background:var(--meet)}
  .seg button.on[data-k="proposal"]{background:var(--prop)}
  /* stat tiles */
  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px}
  .tile{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 10px; box-shadow:var(--shadow)}
  .tile .k{font-size:11px; font-weight:700; color:var(--sub); display:flex; align-items:center; gap:5px}
  .tile .v{font-size:26px; font-weight:850; letter-spacing:-.03em; margin-top:2px}
  .dot{width:9px; height:9px; border-radius:50%}
  .dot.m{background:var(--meet)} .dot.p{background:var(--prop)}
  .tile.m .v{color:var(--meet)} .tile.p .v{color:var(--prop)}
  /* section */
  .sec{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px; box-shadow:var(--shadow)}
  .sec h2{font-size:13px; margin:0 0 10px; color:var(--sub); font-weight:800; letter-spacing:.02em}
  /* weekly */
  .wk{display:flex; align-items:center; gap:10px; padding:6px 0}
  .wk .name{width:52px; font-size:13px; font-weight:700; color:var(--sub)}
  .wk .bars{flex:1; min-width:24px; display:flex; flex-direction:column; gap:3px}
  .bar{height:9px; border-radius:5px; min-width:2px}
  .bar.m{background:var(--meet)} .bar.p{background:var(--prop)}
  .wk .cnt{font-size:11px; color:var(--sub); text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; flex-shrink:0}
  .wk .cnt b{color:var(--ink)}
  /* calendar */
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
  .dow{text-align:center; font-size:11px; font-weight:700; color:var(--sub); padding:2px 0}
  .dow.sun{color:#e5484d} .dow.sat{color:#4f7cff}
  .day{background:var(--bg); border:1px solid transparent; border-radius:10px; min-height:52px;
    padding:4px 3px 3px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px}
  .day.empty{background:transparent; cursor:default}
  .day .num{font-size:12px; font-weight:700}
  .day.sun .num{color:#e5484d} .day.sat .num{color:#4f7cff}
  .day.today{border-color:var(--today)}
  .day.sel{background:var(--today); }
  .day.sel .num{color:#fff}
  .badges{display:flex; gap:3px; flex-wrap:wrap; justify-content:center}
  .bdg{font-size:10px; font-weight:800; padding:1px 5px; border-radius:6px; line-height:1.5}
  .bdg.m{background:var(--meet-bg); color:var(--meet)}
  .bdg.p{background:var(--prop-bg); color:var(--prop)}
  .day.sel .bdg{background:rgba(255,255,255,.22); color:#fff}
  /* day detail */
  .dhead{display:flex; align-items:baseline; gap:8px; margin-bottom:4px}
  .dhead .d{font-size:16px; font-weight:850}
  .dhead .s{font-size:12px; color:var(--sub); font-weight:600}
  .item{border:1px solid var(--line); border-left-width:4px; border-radius:10px; padding:10px 12px; margin-top:8px; background:var(--bg)}
  .item.m{border-left-color:var(--meet)} .item.p{border-left-color:var(--prop)}
  .item .top{display:flex; align-items:center; gap:6px; margin-bottom:3px; flex-wrap:wrap}
  .kind{font-size:11px; font-weight:800; padding:1px 7px; border-radius:6px}
  .kind.m{background:var(--meet-bg); color:var(--meet)} .kind.p{background:var(--prop-bg); color:var(--prop)}
  /* quote(견적) */
  .seg button.on[data-k="quote"]{background:var(--quote)}
  .dot.q{background:var(--quote)} .tile.q .v{color:var(--quote)}
  .bar.q{background:var(--quote)}
  .bdg.q{background:var(--quote-bg); color:var(--quote)}
  .item.q{border-left-color:var(--quote)} .kind.q{background:var(--quote-bg); color:var(--quote)}
  .item .meta b.qd{color:var(--quote)}
  .item .title{font-weight:750; font-size:14px; letter-spacing:-.01em}
  .item .meta{font-size:12px; color:var(--sub); margin-top:3px; display:flex; flex-wrap:wrap}
  .item .meta span{margin-right:10px; white-space:nowrap}
  .item .meta b{color:var(--ink); font-weight:700}
  .empty-msg{color:var(--sub); font-size:13px; text-align:center; padding:16px 0}
  .chipline{font-size:12px; color:var(--sub); margin-top:2px}
  .item .meta span.big{font-size:13px}
  .item .meta b.md{color:var(--meet)} .item .meta b.pd{color:var(--prop)}
  /* view toggle */
  .sechead{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
  .sechead h2{margin:0}
  .vtog{display:flex; gap:4px; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:3px}
  .vtog button{border:0; background:transparent; color:var(--sub); font-weight:700; font-size:12px; padding:5px 12px; border-radius:7px; cursor:pointer}
  .vtog button.on{background:var(--today); color:#fff}
  /* list mode */
  .lday{margin-top:14px}
  .lday:first-child{margin-top:0}
  .lday .lh{display:flex; align-items:baseline; gap:8px; padding-bottom:2px; border-bottom:1px solid var(--line)}
  .lday .lh .d{font-size:15px; font-weight:850}
  .lday .lh .d.todayd{color:var(--meet)}
  .lday .lh .s{font-size:12px; color:var(--sub); font-weight:600}
  /* search */
  .searchbar{position:relative; margin-bottom:12px}
  .searchbar input{width:100%; padding:11px 40px 11px 14px; border:1px solid var(--line); border-radius:12px;
    background:var(--card); color:var(--ink); font-size:15px; box-shadow:var(--shadow); -webkit-appearance:none}
  .searchbar input:focus{outline:none; border-color:var(--meet)}
  .searchbar #qclear{position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0;
    background:var(--line); color:var(--ink); width:26px; height:26px; border-radius:50%; cursor:pointer; font-size:13px; line-height:1}
  body.searching .mview{display:none !important}
  .item.s{border-left-color:var(--sub)}
  .kind.s{background:var(--line); color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📋 회의·제안·견적 일정</h1>
    <span class="built" id="built"></span>
  </header>

  <div class="searchbar">
    <input id="q" type="search" inputmode="latin" autocomplete="off" spellcheck="false"
           placeholder="🔍 LO · RQ 번호 검색 (예: LO50018 / RQ40094)">
    <button id="qclear" aria-label="지우기" style="display:none">✕</button>
  </div>

  <div class="sec" id="searchSec" style="display:none">
    <h2 id="searchTitle" style="color:var(--sub);font-size:13px;font-weight:800;margin:0 0 8px">검색 결과</h2>
    <div id="searchBox"></div>
  </div>

  <div class="mnav mview">
    <button id="prev" aria-label="이전 달">‹</button>
    <div class="lbl" id="mlabel">2026년 7월</div>
    <button id="next" aria-label="다음 달">›</button>
  </div>

  <div class="seg mview" id="seg">
    <button data-k="all" class="on">전체</button>
    <button data-k="meeting">🔵 회의</button>
    <button data-k="proposal">🟠 제안</button>
    <button data-k="quote">🟢 견적</button>
  </div>

  <div class="tiles mview">
    <div class="tile m"><div class="k"><span class="dot m"></span>회의</div><div class="v" id="tMeet">0</div></div>
    <div class="tile p"><div class="k"><span class="dot p"></span>제안</div><div class="v" id="tProp">0</div></div>
    <div class="tile q"><div class="k"><span class="dot q"></span>견적</div><div class="v" id="tQuote">0</div></div>
  </div>

  <div class="sec mview">
    <h2>주별 건수</h2>
    <div id="weekly"></div>
  </div>

  <div class="sec mview" id="calSec">
    <div class="sechead">
      <h2>일별 일정</h2>
      <div class="vtog" id="vtog">
        <button data-v="cal" class="on">달력</button>
        <button data-v="list">리스트</button>
      </div>
    </div>
    <div id="calWrap">
      <div class="cal" id="dow"></div>
      <div class="cal" id="cal" style="margin-top:5px"></div>
    </div>
  </div>

  <div class="sec mview" id="detailSec">
    <div class="dhead"><span class="d" id="dTitle">날짜 선택</span><span class="s" id="dSub"></span></div>
    <div id="detail"></div>
  </div>

  <div class="sec mview" id="listSec" style="display:none">
    <h2 style="color:var(--sub);font-size:13px;font-weight:800;margin:0 0 6px">이번 달 일정 (가까운 날짜순)</h2>
    <div id="listBox"></div>
  </div>
</div>

<script>
const DATA = (window.DASH_DATA||[]);
document.getElementById('built').textContent = '업데이트 ' + (window.DASH_BUILT||'');
const DOW = ['일','월','화','수','목','금','토'];
let filter = 'all';
let viewMode = 'cal'; // 'cal' | 'list'
let cur; // {y, m}  m: 0-based
let selDate = null;

// 초기 월: 항상 오늘 달
(function initMonth(){
  const t = new Date();
  cur = {y:t.getFullYear(), m:t.getMonth()};
})();

function pad(n){return String(n).padStart(2,'0');}
function ymd(y,m,d){return `${y}-${pad(m+1)}-${pad(d)}`;}
function inFilter(e){ return filter==='all' || e.kind===filter; }
function monthEvents(){
  const pre=`${cur.y}-${pad(cur.m+1)}`;
  return DATA.filter(e=>e.date.slice(0,7)===pre);
}

function render(){
  document.getElementById('mlabel').textContent = `${cur.y}년 ${cur.m+1}월`;
  const evs = monthEvents();
  document.getElementById('tMeet').textContent = evs.filter(e=>e.kind==='meeting').length;
  document.getElementById('tProp').textContent = evs.filter(e=>e.kind==='proposal').length;
  document.getElementById('tQuote').textContent = evs.filter(e=>e.kind==='quote').length;
  renderWeekly(evs);
  // 선택일 유지 or 자동선택(오늘 or 이벤트 첫날)
  const days = evs.filter(inFilter).map(e=>e.date);
  if(!selDate || selDate.slice(0,7)!==`${cur.y}-${pad(cur.m+1)}`){
    const today = ymd(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
    selDate = days.includes(today) ? today : (days.sort()[0]||null);
  }
  // 보기 모드 전환
  const isCal = viewMode==='cal';
  document.getElementById('calWrap').style.display = isCal ? '' : 'none';
  document.getElementById('detailSec').style.display = isCal ? '' : 'none';
  document.getElementById('listSec').style.display = isCal ? 'none' : '';
  if(isCal){ renderCalendar(evs); renderDetail(); highlightSel(); }
  else { renderList(evs); }
}

function weekOfMonth(day){ return Math.floor((day-1)/7)+1; } // 단순 7일 묶음
const KINDS=[['meeting','m','회의'],['proposal','p','제안'],['quote','q','견적']];
function activeKinds(){ return KINDS.filter(k=> filter==='all' || filter===k[0]); }
function renderWeekly(evs){
  const wk = {}; // week -> {meeting,proposal,quote}
  evs.forEach(e=>{
    const w=weekOfMonth(+e.date.slice(8,10));
    wk[w]=wk[w]||{meeting:0,proposal:0,quote:0}; wk[w][e.kind]++;
  });
  const weeks=Object.keys(wk).map(Number).sort((a,b)=>a-b);
  const box=document.getElementById('weekly'); box.innerHTML='';
  if(!weeks.length){ box.innerHTML='<div class="empty-msg">이번 달 일정이 없습니다.</div>'; return; }
  const kinds=activeKinds();
  let max=1; weeks.forEach(w=>kinds.forEach(k=>max=Math.max(max,wk[w][k[0]])));
  box.innerHTML=weeks.map(w=>{
    const v=wk[w];
    const bars=kinds.map(k=>`<div class="bar ${k[1]}" style="width:${Math.max(2,v[k[0]]/max*100)}%"></div>`).join('');
    const cnt=kinds.map(k=>`${k[2]} <b>${v[k[0]]}</b>`).join(' · ');
    return `<div class="wk"><div class="name">${w}주차</div>
      <div class="bars">${bars}</div><div class="cnt">${cnt}</div></div>`;
  }).join('');
}

function renderCalendar(evs){
  // 요일 헤더
  const dowBox=document.getElementById('dow'); dowBox.innerHTML='';
  DOW.forEach((d,i)=>{ const el=document.createElement('div'); el.className='dow'+(i===0?' sun':i===6?' sat':''); el.textContent=d; dowBox.appendChild(el); });
  // 날짜별 집계
  const map={}; evs.forEach(e=>{ if(!inFilter(e))return; const d=e.date; map[d]=map[d]||{meeting:0,proposal:0,quote:0}; map[d][e.kind]++; });
  const first=new Date(cur.y,cur.m,1).getDay();
  const dim=new Date(cur.y,cur.m+1,0).getDate();
  const today=ymd(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());
  const cal=document.getElementById('cal'); cal.innerHTML='';
  for(let i=0;i<first;i++){ const e=document.createElement('div'); e.className='day empty'; cal.appendChild(e); }
  for(let d=1; d<=dim; d++){
    const ds=ymd(cur.y,cur.m,d); const dow=new Date(cur.y,cur.m,d).getDay();
    const cell=document.createElement('div');
    cell.className='day'+(dow===0?' sun':dow===6?' sat':'')+(ds===today?' today':'');
    cell.dataset.date=ds;
    const c=map[ds];
    cell.innerHTML=`<div class="num">${d}</div><div class="badges">
      ${c&&c.meeting?`<span class="bdg m">${c.meeting}</span>`:''}
      ${c&&c.proposal?`<span class="bdg p">${c.proposal}</span>`:''}
      ${c&&c.quote?`<span class="bdg q">${c.quote}</span>`:''}</div>`;
    cell.onclick=()=>{ selDate=ds; renderDetail(); highlightSel(); };
    cal.appendChild(cell);
  }
}

function highlightSel(){
  document.querySelectorAll('.day').forEach(el=>el.classList.toggle('sel', el.dataset.date===selDate));
}

function mmdd(d){ return d ? `${d.slice(5,7)}/${d.slice(8,10)}` : ''; }

// 한 건(회의/제안) 카드 HTML.
//  회의: 제목·LO·규격·라인/공정·설비·회의시간·장소·담당·진행상황 (+회의일)
//  제안: 제목·LO·규격·제안마감일 (+회의일)  ← 간결
function itemHTML(e){
  const cls = e.kind==='meeting'?'m':e.kind==='proposal'?'p':'q';
  const label = e.kind==='meeting'?'회의':e.kind==='proposal'?'제안마감':'견적마감';
  const meta = [];
  let titleText;
  if(e.kind==='quote'){
    titleText = e.title || e.rq || e.lo;   // 제품명 없으면 RQ(없으면 LO)를 헤드라인으로
    if(e.title && e.rq) meta.push(`<span><b>${esc(e.rq)}</b></span>`);
    if(e.lo) meta.push(`<span>${esc(e.lo)}</span>`);
    if(e.ddate||e.date) meta.push(`<span class="big">🟢 견적마감 <b class="qd">${mmdd(e.ddate||e.date)}</b></span>`);
    if(e.reqdate) meta.push(`<span>요청 ${mmdd(e.reqdate)}</span>`);
  } else {
    titleText = e.title || e.lo;           // 제목 없으면 LO를 헤드라인으로
    if(e.title) meta.push(`<span><b>${esc(e.lo)}</b></span>`);   // 제목 있을 때만 LO를 메타에(중복 방지)
    if(e.spec) meta.push(`<span>규격 ${esc(e.spec)}</span>`);
    if(e.kind==='meeting'){
      if(e.line) meta.push(`<span>${esc(e.line)}</span>`);
      if(e.equip) meta.push(`<span>${esc(e.equip)}</span>`);
      if(e.mtime) meta.push(`<span>🕒 ${esc(e.mtime)}</span>`);
      if(e.place) meta.push(`<span>📍 ${esc(e.place)}</span>`);
      if(e.mdate) meta.push(`<span class="big">🔵 회의일 <b class="md">${mmdd(e.mdate)}</b></span>`);
    } else {
      if(e.pdate||e.date) meta.push(`<span class="big">🟠 제안마감 <b class="pd">${mmdd(e.pdate||e.date)}</b></span>`);
      if(e.mdate) meta.push(`<span class="big">🔵 회의일 <b class="md">${mmdd(e.mdate)}</b></span>`);
    }
  }
  const who = [e.hyeon&&`현업 ${e.hyeon}`, e.tech&&`기술 ${e.tech}`].filter(Boolean).join(' · ');
  return `<div class="item ${cls}">
    <div class="top"><span class="kind ${cls}">${label}</span>
      <span class="title">${esc(titleText)}</span></div>
    <div class="meta">${meta.join('')}</div>
    ${who?`<div class="chipline">${esc(who)}</div>`:''}
    ${e.kind==='meeting'&&e.status?`<div class="chipline">📝 ${esc(e.status)}</div>`:''}
  </div>`;
}

const KIND_ORDER={meeting:0,proposal:1,quote:2};
function dayItems(date){
  return DATA.filter(e=>e.date===date && inFilter(e))
    .sort((a,b)=> KIND_ORDER[a.kind]-KIND_ORDER[b.kind]);
}
function countText(list){
  return KINDS.map(k=>{ const n=list.filter(e=>e.kind===k[0]).length; return n?`${k[2]} ${n}`:null; })
              .filter(Boolean).join(' · ');
}

function renderDetail(){
  const box=document.getElementById('detail');
  const tt=document.getElementById('dTitle'), sub=document.getElementById('dSub');
  if(!selDate){ tt.textContent='날짜 선택'; sub.textContent=''; box.innerHTML='<div class="empty-msg">위 달력에서 날짜를 눌러주세요.</div>'; return; }
  const list=dayItems(selDate);
  const dt=new Date(selDate); tt.textContent=`${selDate.slice(5,7)}월 ${+selDate.slice(8,10)}일 (${DOW[dt.getDay()]})`;
  sub.textContent = countText(list);
  if(!list.length){ box.innerHTML='<div class="empty-msg">선택한 필터의 일정이 없습니다.</div>'; return; }
  box.innerHTML = list.map(itemHTML).join('');
}

function renderList(evs){
  const box=document.getElementById('listBox');
  const today = ymd(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
  const dates=[...new Set(evs.filter(inFilter).map(e=>e.date))].sort();
  if(!dates.length){ box.innerHTML='<div class="empty-msg">이번 달 일정이 없습니다.</div>'; return; }
  box.innerHTML = dates.map(d=>{
    const list=dayItems(d);
    const dt=new Date(d);
    const cnt=countText(list);
    return `<div class="lday">
      <div class="lh"><span class="d ${d===today?'todayd':''}">${+d.slice(5,7)}월 ${+d.slice(8,10)}일 (${DOW[dt.getDay()]})</span>
        <span class="s">${cnt}</span></div>
      ${list.map(itemHTML).join('')}
    </div>`;
  }).join('');
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// events
document.getElementById('prev').onclick=()=>{ cur.m--; if(cur.m<0){cur.m=11;cur.y--;} render(); };
document.getElementById('next').onclick=()=>{ cur.m++; if(cur.m>11){cur.m=0;cur.y++;} render(); };
document.getElementById('seg').onclick=(ev)=>{
  const b=ev.target.closest('button'); if(!b)return;
  filter=b.dataset.k;
  document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));
  render();
};
document.getElementById('vtog').onclick=(ev)=>{
  const b=ev.target.closest('button'); if(!b)return;
  viewMode=b.dataset.v;
  document.querySelectorAll('#vtog button').forEach(x=>x.classList.toggle('on',x===b));
  render();
};

// ---- LO 검색 ----
// LO의 회의/제안 이벤트에서 한 건(LO당 1장)으로 합쳐 관련 정보를 모두 보여준다.
function searchCardHTML(e){
  const meta=[];
  if(e.kind==='quote'){
    if(e.rq) meta.push(`<span><b>${esc(e.rq)}</b></span>`);
    if(e.lo) meta.push(`<span>${esc(e.lo)}</span>`);
    if(e.ddate) meta.push(`<span class="big">🟢 견적마감 <b class="qd">${mmdd(e.ddate)}</b></span>`);
    if(e.reqdate) meta.push(`<span>요청 ${mmdd(e.reqdate)}</span>`);
    const qwho=[e.hyeon&&`현업 ${e.hyeon}`, e.tech&&`기술 ${e.tech}`].filter(Boolean).join(' · ');
    return `<div class="item q">
      <div class="top"><span class="kind q">견적</span><span class="title">${esc(e.title||e.rq||e.lo)}</span></div>
      <div class="meta">${meta.join('')}</div>
      ${qwho?`<div class="chipline">${esc(qwho)}</div>`:''}
    </div>`;
  }
  meta.push(`<span><b>${esc(e.lo)}</b></span>`);
  if(e.itype) meta.push(`<span>${esc(e.itype)}</span>`);
  if(e.spec) meta.push(`<span>규격 ${esc(e.spec)}</span>`);
  if(e.line) meta.push(`<span>${esc(e.line)}</span>`);
  if(e.equip) meta.push(`<span>${esc(e.equip)}</span>`);
  if(e.mdate) meta.push(`<span class="big">🔵 회의일 <b class="md">${mmdd(e.mdate)}</b>${e.mtime?' '+esc(e.mtime):''}</span>`);
  if(e.place) meta.push(`<span>📍 ${esc(e.place)}</span>`);
  if(e.pdate) meta.push(`<span class="big">🟠 제안마감 <b class="pd">${mmdd(e.pdate)}</b></span>`);
  const who=[e.hyeon&&`현업 ${e.hyeon}`, e.tech&&`기술 ${e.tech}`].filter(Boolean).join(' · ');
  return `<div class="item s">
    <div class="top"><span class="kind s">${esc(e.gubun?('#'+e.gubun):'LO')}</span>
      <span class="title">${esc(e.title||e.lo)}</span></div>
    <div class="meta">${meta.join('')}</div>
    ${who?`<div class="chipline">${esc(who)}</div>`:''}
    ${e.status?`<div class="chipline">📝 ${esc(e.status)}</div>`:''}
  </div>`;
}
function renderSearch(q){
  const box=document.getElementById('searchBox'), tt=document.getElementById('searchTitle');
  const qq=q.trim().toUpperCase().replace(/\s+/g,'');
  const seen={}, cards=[];
  DATA.forEach(e=>{
    const lo=(e.lo||'').toUpperCase().replace(/\s+/g,'');
    const rq=(e.rq||'').toUpperCase().replace(/\s+/g,'');
    if(!(lo.includes(qq) || (rq && rq.includes(qq)))) return;
    const key = e.kind==='quote' ? ('RQ:'+(e.rq||e.lo)) : ('LO:'+e.lo);   // 회의/제안은 LO당 1장, 견적은 RQ당 1장
    if(seen[key]) return; seen[key]=1; cards.push(e);
  });
  cards.sort((a,b)=> (a.kind==='quote'?1:0)-(b.kind==='quote'?1:0));   // LO(회의·제안) 먼저, 견적(RQ) 나중
  tt.textContent=`검색 결과 ${cards.length}건`;
  if(!cards.length){
    box.innerHTML=`<div class="empty-msg">"${esc(q)}" 에 해당하는 LO/RQ가 없습니다.</div>`;
    return;
  }
  box.innerHTML=cards.map(searchCardHTML).join('');
}
const qEl=document.getElementById('q'), qClear=document.getElementById('qclear');
qEl.addEventListener('input',()=>{
  const v=qEl.value.trim();
  qClear.style.display=v?'':'none';
  if(v){ document.body.classList.add('searching'); document.getElementById('searchSec').style.display=''; renderSearch(v); }
  else { document.body.classList.remove('searching'); document.getElementById('searchSec').style.display='none'; render(); }
});
qClear.onclick=()=>{ qEl.value=''; qEl.dispatchEvent(new Event('input')); qEl.focus(); };

render();
</script>

<div id="gate" style="position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center">
  <div style="font-size:34px">🔒</div>
  <div style="font-size:15px;color:var(--ink);font-weight:800">회의·제안 일정 · 팀 전용</div>
  <div style="font-size:12px;color:var(--sub)">비밀번호를 입력하세요</div>
  <input id="gpw" type="password" inputmode="numeric" autocomplete="off"
    style="width:200px;max-width:80%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:16px;text-align:center">
  <button id="gbtn" style="border:0;background:var(--meet);color:#fff;font-weight:800;padding:10px 22px;border-radius:12px;font-size:15px;cursor:pointer">열기</button>
  <div id="gerr" style="color:#e5484d;font-size:12px;height:14px"></div>
</div>
<script>
(function(){
  var PW='2061';
  var gate=document.getElementById('gate'),pw=document.getElementById('gpw'),
      btn=document.getElementById('gbtn'),err=document.getElementById('gerr');
  if(!PW){ gate.remove(); return; }
  if(sessionStorage.getItem('sched_unlocked')==='1'){ gate.remove(); return; }
  function open_(){ if(pw.value===PW){ sessionStorage.setItem('sched_unlocked','1'); gate.remove(); }
    else { err.textContent='비밀번호가 올바르지 않습니다.'; pw.value=''; pw.focus(); } }
  btn.onclick=open_;
  pw.addEventListener('keydown',function(e){ if(e.key==='Enter') open_(); });
  setTimeout(function(){ pw.focus(); },100);
})();
</script>
